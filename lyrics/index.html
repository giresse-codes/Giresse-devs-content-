<!doctype html>
<html><head><meta charset="utf-8"><title>Lyrics</title>
<link rel="stylesheet" href="../edit/assets/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Inter',sans-serif;color:#fff}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
#glow{background:radial-gradient(ellipse 70% 45% at 50% 100%,rgba(30,215,96,.55) 0%,rgba(10,80,40,.25) 45%,transparent 75%)}
#glow2{background:radial-gradient(ellipse 60% 35% at 50% 0%,rgba(30,215,96,.12),transparent 70%)}
#space{perspective:1400px;perspective-origin:540px 960px}
.tile{position:absolute;left:0;top:0;border-radius:26px;overflow:hidden;background:#151a17;box-shadow:0 30px 70px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.tile .em{font-size:120px;line-height:1}
.tile .sh{position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.18),transparent 45%)}
#lines{position:absolute;left:60px;width:960px;top:1080px;transform:translateY(-50%);text-align:center}
.ln{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:22px;row-gap:6px}
.w{display:inline-block;white-space:nowrap;font-weight:600;letter-spacing:-1.5px;line-height:1.1}
.k{font-family:'Syncopate';font-weight:700;letter-spacing:4px;text-transform:uppercase}
.ad{font-family:'JetBrains Mono';font-weight:500;letter-spacing:2px}
#mark{left:0;width:1080px;top:880px;text-align:center;font-family:'Syncopate';font-weight:700;font-size:96px;letter-spacing:10px}
#vig{background:radial-gradient(ellipse 85% 70% at 50% 50%,transparent 50%,rgba(0,0,0,.75) 100%)}
#flash{background:#fff;opacity:0}
#grain{width:1080px;height:1920px;opacity:.06;mix-blend-mode:overlay}
</style></head>
<body><div id="stage">
 <div id="glow" class="layer"></div><div id="glow2" class="layer"></div>
 <div id="space" class="layer"></div>
 <div id="cam" class="layer"><div id="lines"></div><div id="mark" class="abs" style="position:absolute"></div></div>
 <div id="vig" class="layer"></div>
 <div id="flash" class="layer"></div>
 <canvas id="grain" class="layer" width="360" height="640"></canvas>
</div>
<script src="words.js"></script>
<script src="lyrics.js"></script>
</body></html>
