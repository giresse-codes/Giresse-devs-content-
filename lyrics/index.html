<!doctype html>
<html><head><meta charset="utf-8"><title>Lyrics</title>
<link rel="stylesheet" href="../edit/assets/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1a0420}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
#rays{left:-460px;top:-160px;width:2000px;height:2000px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 10%,transparent 62%);mask-image:radial-gradient(circle,#000 10%,transparent 62%)}
#cam{transform-origin:540px 1150px}
#chunk{position:absolute;left:40px;width:1000px;top:1150px;transform:translateY(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:30px;row-gap:0}
.wd{position:relative;display:inline-block;font-family:'Nunito';font-weight:900;line-height:1.02;white-space:nowrap}
.wd .s{position:absolute;left:0;top:0;color:#000;-webkit-text-stroke:var(--sw) #000}
.wd .f{position:relative}
.stk{position:absolute;font-family:'Nunito';font-weight:900;white-space:nowrap}
#tag{left:540px;top:250px;transform:translateX(-50%);padding:16px 34px;border-radius:40px;background:rgba(0,0,0,.45);color:#fff;font-family:'Nunito';font-weight:800;font-size:34px;white-space:nowrap;border:2px solid rgba(255,255,255,.25)}
#flash{background:#fff;opacity:0}
#fx{left:0;top:0}
#grain{width:1080px;height:1920px;opacity:.07;mix-blend-mode:overlay}
</style></head>
<body><div id="stage">
 <div id="bg" class="layer"><div class="blob" id="b1" style="width:1000px;height:1000px"></div><div class="blob" id="b2" style="width:900px;height:900px"></div><div class="blob" id="b3" style="width:700px;height:700px"></div></div>
 <div id="rays" class="abs" style="position:absolute"></div>
 <canvas id="fx" class="layer" width="1080" height="1920"></canvas>
 <div id="cam" class="layer"><div id="chunk"></div><div id="stickers" class="layer"></div></div>
 <div id="tag" class="abs" style="position:absolute">🔥 Issah — Baddies in Belgica</div>
 <div id="flash" class="layer"></div>
 <canvas id="grain" class="layer" width="360" height="640"></canvas>
</div>
<script src="words.js"></script>
<script src="lyrics.js"></script>
</body></html>
