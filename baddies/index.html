<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Baddies Airlines</title>
<link rel="stylesheet" href="../edit/assets/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#05070d;font-family:'Inter',sans-serif;color:#0d1220}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
.abs{position:absolute}
#cam{transform-origin:540px 760px}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
#shapeA,#shapeB{position:absolute;border-radius:40px;background:#1d8cff;box-shadow:0 0 60px rgba(29,140,255,.8)}
#bar{position:absolute;left:120px;top:640px;width:840px;height:120px;border-radius:60px;background:#fff;box-shadow:0 24px 70px rgba(30,60,140,.22);overflow:hidden}
#bar .ic{position:absolute;top:34px;font-size:42px;color:#222}
#barTxt{position:absolute;left:108px;top:0;line-height:120px;font-size:46px;color:#9aa0ad;white-space:nowrap}
#caption{left:540px;top:210px;transform:translateX(-50%);padding:22px 38px;border-radius:40px;background:rgba(255,255,255,.95);box-shadow:0 18px 50px rgba(0,0,0,.25);font-weight:800;font-size:44px;white-space:nowrap;color:#0d1220}

/* wallet passes */
#wallet{perspective:1800px;perspective-origin:540px 700px}
.pass{position:absolute;left:110px;top:0;width:860px;height:330px;border-radius:36px;color:#fff;overflow:hidden;
  box-shadow:0 30px 80px rgba(10,20,60,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.pass .gloss{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 40%,transparent 70%,rgba(255,255,255,.12))}
.pass .air{position:absolute;left:36px;top:28px;font-size:22px;font-weight:800;letter-spacing:4px;opacity:.9}
.pass .gate{position:absolute;right:36px;top:28px;font-size:22px;font-weight:700;letter-spacing:3px;opacity:.9}
.pass .route{position:absolute;left:36px;top:82px;font-family:'JetBrains Mono';font-weight:700;font-size:64px;letter-spacing:2px;white-space:nowrap}
.pass .route span{font-size:40px;opacity:.85;margin:0 14px}
.pass .country{position:absolute;left:36px;top:168px;font-size:84px;font-weight:900;letter-spacing:-2px;line-height:1}
.pass .flag{position:absolute;right:40px;top:96px;font-size:150px;line-height:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3))}
.pass .barcode{position:absolute;left:36px;bottom:26px;width:330px;height:34px;background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 6px,#fff 6px 7px,transparent 7px 11px,#fff 11px 15px,transparent 15px 17px);opacity:.85}
.pass .seat{position:absolute;right:36px;bottom:28px;font-family:'JetBrains Mono';font-size:22px;opacity:.9}
.pass .notch{position:absolute;top:150px;width:44px;height:44px;border-radius:50%;background:var(--bg)}
.stamp{position:absolute;right:190px;top:120px;width:200px;height:200px;border-radius:50%;border:7px solid rgba(255,40,70,.92);color:rgba(255,40,70,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:26px;letter-spacing:3px;line-height:1.1;text-align:center;
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.0),inset 0 0 0 10px rgba(255,40,70,.5);mix-blend-mode:normal;background:rgba(255,255,255,.08)}
.stamp b{font-size:58px;letter-spacing:0}
#route{left:0;top:0}

/* contacts */
.contact{position:absolute;left:150px;top:0;width:780px;height:440px;border-radius:44px;background:#fff;box-shadow:0 30px 80px rgba(40,30,120,.25);overflow:hidden}
.contact .av{position:absolute;left:44px;top:44px;width:170px;height:170px;border-radius:50%;background:#f1f3f8;display:flex;align-items:center;justify-content:center;font-size:110px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.contact .nm{position:absolute;left:244px;top:62px;font-size:80px;font-weight:900;letter-spacing:-2px;line-height:1}
.contact .sub{position:absolute;left:248px;top:156px;font-size:30px;color:#7a8195;font-weight:600}
.contact .chips{position:absolute;left:44px;top:250px;display:flex;gap:14px}
.contact .chip{padding:12px 24px;border-radius:24px;font-size:28px;font-weight:700}
.contact .btn{position:absolute;left:44px;bottom:40px;padding:18px 38px;border-radius:34px;background:#1d8cff;color:#fff;font-size:30px;font-weight:700}
#cursor{width:70px;height:70px}

/* twist */
#twist{display:flex;flex-direction:column;align-items:center}
#bigFlag{font-size:360px;line-height:1;filter:drop-shadow(0 0 60px rgba(255,255,255,.35))}
#bigWord{margin-top:10px;font-size:150px;font-weight:900;letter-spacing:-5px;color:#fff;line-height:1}
#bubble{position:absolute;right:80px;top:1010px;max-width:820px;padding:30px 44px;border-radius:46px 46px 12px 46px;background:#1d8cff;color:#fff;font-size:46px;font-weight:600;box-shadow:0 20px 60px rgba(29,140,255,.45);white-space:nowrap}
.dots i{display:inline-block;width:18px;height:18px;border-radius:50%;background:#fff;margin:0 6px}

/* lyrics (Apple Music style) */
#lyrWin{left:0;top:1230px;width:1080px;height:520px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 0%,#000 55%,transparent 100%);mask-image:linear-gradient(#000 0%,#000 55%,transparent 100%)}
#lyr{position:absolute;left:70px;top:0;width:940px}
.ln{font-weight:800;font-size:66px;line-height:1.12;letter-spacing:-1.5px;margin-bottom:34px}
.ln .ad{font-weight:700;opacity:.8}
#flash{background:#fff;opacity:0}
#grain{width:1080px;height:1920px;opacity:.05;mix-blend-mode:overlay}
</style>
</head>
<body>
<div id="stage">
  <div id="cam" class="layer">
    <div id="bg" class="layer">
      <div class="blob" id="b1" style="width:900px;height:900px"></div>
      <div class="blob" id="b2" style="width:700px;height:700px"></div>
    </div>
    <div id="shapeA"></div><div id="shapeB"></div>
    <div id="bar"><div class="ic" style="left:46px">⌕</div><div id="barTxt">search...</div><div class="ic" style="right:46px">↻</div></div>
    <div id="wallet" class="layer"></div>
    <svg id="route" class="abs" width="1080" height="1920"></svg>
    <div id="contacts" class="layer"></div>
    <svg id="cursor" class="abs" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.5 22.5 L15.5 21 L12 14 L19 14 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div id="twist" class="layer" style="padding-top:360px"><div id="bigFlag">🇲🇾</div><div id="bigWord">malaisien.</div></div>
    <div id="bubble"></div>
    <div id="lyrWin" class="abs"><div id="lyr"></div></div>
  </div>
  <div id="caption" class="abs">POV : t'as des baddies dans chaque pays 🌍</div>
  <div id="flash" class="layer"></div>
  <canvas id="grain" class="layer" width="360" height="640"></canvas>
</div>
<script src="baddies.js"></script>
</body>
</html>
